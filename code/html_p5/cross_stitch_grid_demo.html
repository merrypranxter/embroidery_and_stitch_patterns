<!doctype html><html><head><meta charset="utf-8"><title>Cross Stitch Grid Demo</title><script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script></head><body><script>
let palette=['#ff3f9f','#20e0ff','#fff45c','#7cff6b','#5a2cff','#ffffff'];
function setup(){createCanvas(900,900); noLoop();}
function draw(){background(28,24,32); let n=34, s=width/n; strokeWeight(2); for(let y=0;y<n;y++){for(let x=0;x<n;x++){let cx=x*s+s/2, cy=y*s+s/2; let d=dist(x,y,n/2,n/2); if(noise(x*.13,y*.13)<0.55 || d<10){stroke(random(palette)); line(cx-s*.3,cy-s*.3,cx+s*.3,cy+s*.3); line(cx+s*.3,cy-s*.3,cx-s*.3,cy+s*.3);}}} }
function mousePressed(){redraw();}
</script></body></html>
